<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHub LCD UI 编辑器</title>
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #0e1320;
    --card: #151c2f;
    --card2: #1a2238;
    --border: #243049;
    --text: #eef2ff;
    --muted: #8b9bb4;
    --dim: #5c6b85;
    --accent: #6366f1;
    --accent2: #818cf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  header h1 span { color: var(--accent2); font-weight: 400; }
  button {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 12px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); }
  button.danger:hover { border-color: var(--bad); color: #fca5a5; }
  button:disabled { opacity: .45; cursor: default; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--bad); }
  #status.warn { color: var(--warn); }
  #dirty { color: var(--warn); margin-left: 8px; }
  main { flex: 1; display: flex; min-height: 0; }
  #tree {
    width: 380px; flex: none; overflow: auto; padding: 10px 8px;
    border-right: 1px solid var(--border); background: var(--panel);
  }
  #panel { flex: 1; overflow: auto; padding: 14px 18px; }
  .group-name {
    color: var(--dim); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; margin: 12px 0 4px 4px;
  }
  .node {
    display: flex; align-items: center; gap: 6px; padding: 3px 6px;
    border-radius: 5px; cursor: pointer; white-space: nowrap;
  }
  .node:hover { background: var(--card); }
  .node.sel { background: var(--card2); outline: 1px solid var(--accent); }
  .node .tw { width: 10px; color: var(--dim); font-size: 10px; }
  .node .type { color: var(--accent2); font-size: 11px; }
  .node .id { color: var(--text); }
  .node .id.missing { color: var(--dim); font-style: italic; }
  .node .badge {
    margin-left: auto; font-size: 10px; color: var(--dim);
    border: 1px solid var(--border); border-radius: 4px; padding: 0 4px;
  }
  .kids { margin-left: 14px; border-left: 1px solid var(--border); padding-left: 4px; }
  .section {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
  }
  .section > h2 {
    margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--accent2);
    letter-spacing: .04em;
  }
  .kv-row { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; }
  .kv-row input {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px; font-size: 12px; font-family: inherit;
  }
  .kv-key { width: 150px; flex: none; }
  .kv-val { flex: 1; min-width: 80px; }
  .kv-color { width: 30px; flex: none; padding: 0; height: 26px; }
  .kv-del { padding: 3px 8px; line-height: 1; }
  .field { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .field > label { width: 120px; flex: none; color: var(--muted); }
  .field > input, .field > select, .field > textarea {
    flex: 1; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 5px;
    padding: 4px 7px; font-size: 12px; font-family: inherit;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .hint { color: var(--dim); padding: 30px; text-align: center; }
  .crumb { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
  .crumb b { color: var(--muted); font-weight: 500; }
  textarea.raw {
    width: 100%; min-height: 220px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px;
  }
  details.out { margin-top: 10px; }
  details.out pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px; max-height: 260px; overflow: auto; font-size: 11px;
    color: var(--muted); white-space: pre-wrap;
  }
  .ok-tag { color: var(--ok); font-size: 11px; }
  /* --- mode switch --- */
  .modes { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .modes button { border: 0; border-radius: 0; padding: 5px 12px; }
  .modes button + button { border-left: 1px solid var(--border); }
  .modes button.on { background: var(--accent); color: #fff; }
  /* --- preview --- */
  .pv-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .pv-bar button { padding: 4px 10px; }
  .pv-bar button.on { background: var(--accent); border-color: var(--accent); }
  .pv-wrap { overflow: auto; padding-bottom: 12px; }
  .pv-stage {
    position: relative; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; background: #000; box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .pv-screen { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .pv-node { position: absolute; box-sizing: border-box; }
  .pv-node.pv-label { display: flex; align-items: center; }
  .pv-text { white-space: pre; line-height: 1.32; }
  .pv-empty { outline: 1px dashed rgba(239,68,68,.22); }
  .pv-image {
    width: 100%; height: 100%; display: flex; align-items: center;
    justify-content: center; font-size: 9px; color: var(--dim);
    background: repeating-linear-gradient(45deg, #1a2238, #1a2238 6px, #151c2f 6px, #151c2f 12px);
    border: 1px dashed var(--border); overflow: hidden; text-align: center;
  }
  .pv-button { cursor: pointer; }
  .pv-scrollable { outline: 1px dashed rgba(99,102,241,.35); }
  .pv-node:hover { outline: 1px solid var(--accent); outline-offset: -1px; }
  .pv-note { color: var(--dim); font-size: 11.5px; margin-bottom: 10px; line-height: 1.6; }
  .pv-bar select, .pv-bar input[type=number] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 7px; font-size: 12px; font-family: inherit;
  }
  .pv-bar input[type=number] { width: 84px; }
  .pv-bar label {
    display: flex; align-items: center; gap: 5px;
    color: var(--muted); font-size: 12px; cursor: pointer;
  }
  .pv-res { color: var(--muted); font-size: 11.5px; align-self: center; }
  .pv-fixed-layer {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .pv-fixed-box {
    position: absolute; border: 2px dashed var(--warn);
    box-shadow: 0 0 0 1px rgba(0,0,0,.45); pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>MiniHub <span>LCD UI 编辑器</span></h1>
  <div class="modes">
    <button id="mode-edit" class="on">结构编辑</button>
    <button id="mode-preview">屏幕预览</button>
  </div>
  <button id="btn-reload">重新加载</button>
  <button id="btn-validate">校验</button>
  <button id="btn-save" class="primary">保存</button>
  <span id="dirty"></span>
  <span id="status">就绪</span>
</header>
<main>
  <div id="tree"></div>
  <div id="panel"><div class="hint">从左侧选择一个节点</div></div>
</main>

<details id="out" class="out" style="display:none">
  <summary>contract 测试输出</summary>
  <pre></pre>
</details>

<datalist id="action-list"></datalist>

<script src="preview.js"></script>
<script src="app.js"></script>
</body>
</html>
