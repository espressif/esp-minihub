# Shared MiniHub Host base (not product-specific).
# Product profiles live in application/<name>/manifest.yml and are merged at sync time:
#   MINIHUB_APP=<name> python tools/sync_host_manifest.py
#
# Sdkconfig recipe = application/<app>/config/sdkconfig/app.yml
# Shared fragments: config/sdkconfig/README.md

version: '1.0'
profile: minihub
hardware:
  target: esp32s31
  flash_mb: 16
  module: ESP32-S31
profiles:
  _host_base:
    partition_table: partitions.csv
    components:
      require:
      - minihub_bundle
      - minihub_core
      - minihub_config
      - minihub_adapter
      - minihub_rules
      - minihub_scenes
      - minihub_web
      - minihub_pack
      - minihub_module
      - minihub_store
      - minihub_hub
      - minihub_auth
      - minihub_ota
      - minihub_provision
      - minihub_matter
      - minihub_thread
      - minihub_rainmaker
      - minihub_net
      - gen_bmgr_codes
      - adapter_mqtt
      - adapter_wifi
      - adapter_zigbee
      - adapter_ble_mesh
      - adapter_modbus
      - adapter_matter
      - adapter_thread
      - minihub_zigbee
      - minihub_ble_mesh
      - minihub_ble_gatt
      - minihub_usb_msc
      - minihub_rtsp_cam
      - nvs_flash
      - esp_wifi
      - esp_netif
      - esp_event
      - lwip
      - esp_system
      adapters:
      - name: mqtt
        kconfig: MINIHUB_MQTT_ADAPTER
      - name: wifi
        kconfig: MINIHUB_NET_WIFI_STA
      - name: zigbee
        kconfig: MINIHUB_ZIGBEE_SDK
      - name: ble_mesh
        kconfig: MINIHUB_BLE_MESH_SDK
      - name: modbus
        kconfig: MINIHUB_MODBUS
      - name: matter
        kconfig: MINIHUB_MATTER_ADAPTER
        dynamic: true
        host_static: true
      - name: thread
        kconfig: MINIHUB_THREAD_ADAPTER
        host_static: true
    idf_dependencies:
      joltwallet/littlefs: ~=1.21.0
      espressif/cjson: ^1.7.19
      espressif/network_provisioning: ^1.1.0
      espressif/mqtt: ^1.0.0
      espressif/esp_flash_dispatcher: ^1.0.2
      espressif/esp_board_manager: ~0.5.15
