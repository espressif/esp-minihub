<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="260" viewBox="0 0 1180 260" font-family="IBM Plex Sans, Noto Sans CJK SC, sans-serif" role="img">
<title>MiniHub — host firmware for a multi-protocol device hub</title>
<style>:root{--ink:#f5f7fa;--mut:rgba(245,247,250,.72);--dim:rgba(245,247,250,.5);--line:rgba(245,247,250,.18)}.t{fill:var(--ink);font-size:54px;font-weight:800;letter-spacing:-.5px}.g{fill:var(--mut);font-size:20px;font-weight:500}.s{fill:var(--dim);font-size:14px}@keyframes spot{0%{opacity:0}1.5%{opacity:1}12%{opacity:1}14.5%{opacity:0}100%{opacity:0}}@keyframes breath{0%{transform:scale(1)}1.5%{transform:scale(1.18)}12%{transform:scale(1.18)}14.5%{transform:scale(1)}100%{transform:scale(1)}}@keyframes march{to{stroke-dashoffset:-22}}@keyframes travel{0%{transform:translateX(0);opacity:0}1.5%{opacity:1}12%{opacity:1}14.5%{transform:translateX(var(--span));opacity:0}100%{transform:translateX(var(--span));opacity:0}}.node{opacity:0}.fl{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 7;opacity:0}.dot{opacity:0}@media (prefers-reduced-motion: reduce){.node,.fl,.dot{animation:none}.node{opacity:1}.dot{display:none}.fl{opacity:.45}}</style>
<defs><linearGradient id="hb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#0b1020"/></linearGradient><radialGradient id="hg" cx="0.82" cy="0.18" r="0.7"><stop offset="0" stop-color="#1c8fb8" stop-opacity=".35"/><stop offset="1" stop-color="#1c8fb8" stop-opacity="0"/></radialGradient><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/></filter></defs>
<rect width="1180" height="260" rx="20" fill="url(#hb)"/>
<rect width="1180" height="260" rx="20" fill="url(#hg)"/>
<text x="56" y="108" class="t">MiniHub</text>
<text x="58" y="146" class="g">把多种协议设备聚成一台 Hub 的 Host 固件</text>
<text x="58" y="176" class="s">一个固件 · Web 控制台 · REST · WebSocket · 规则引擎 · 适配器</text>
