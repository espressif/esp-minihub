<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" font-family="IBM Plex Sans, Noto Sans CJK SC, sans-serif" role="img">
<title>MiniHub boot sequence / MiniHub 上电时序</title>
<style>
:root{--ink:#14202e;--muted:#54616e;--line:rgba(20,32,46,.18);--panel:#fff;
--base:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#9fb0c0;
--line:rgba(230,237,243,.20);--panel:#161b22;--base:#0d1117}}
.t{fill:var(--ink);font-size:15px;font-weight:700}.d{fill:var(--muted);font-size:12.5px;font-family:IBM Plex Mono, Menlo, monospace}@keyframes spot{0%{opacity:0}1.5%{opacity:1}12%{opacity:1}14.5%{opacity:0}100%{opacity:0}}@keyframes breath{0%{transform:scale(1)}1.5%{transform:scale(1.12)}12%{transform:scale(1.12)}14.5%{transform:scale(1)}100%{transform:scale(1)}}@keyframes marchV{to{stroke-dashoffset:-22}}@keyframes drop{0%{transform:translateY(0);opacity:0}1.5%{opacity:1}12%{opacity:1}14.5%{transform:translateY(var(--span));opacity:0}100%{transform:translateY(var(--span));opacity:0}}.ring{fill:none;stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center}.node{fill:var(--panel);stroke:var(--line);stroke-width:2}.fill{opacity:0}.fl{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:5 7;opacity:0}.dot{opacity:0}@media (prefers-reduced-motion: reduce){.ring,.fill,.fl,.dot{animation:none}.fl{opacity:.5}.dot{display:none}.fill{opacity:1}.node{fill:var(--accent)}}</style>
<defs><marker id="bd" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#1c8fb8"/></marker><filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14202e" flood-opacity="0.10"/></filter>
<linearGradient id="bfill0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8362d"/><stop offset="1" stop-color="#e8362d" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c8fb8"/><stop offset="1" stop-color="#1c8fb8" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ca678"/><stop offset="1" stop-color="#0ca678" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c77f0a"/><stop offset="1" stop-color="#c77f0a" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#7c5cff" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6336c"/><stop offset="1" stop-color="#d6336c" stop-opacity=".55"/></linearGradient>
<linearGradient id="bfill6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#0a84ff" stop-opacity=".55"/></linearGradient>
</defs>
<rect width="720" height="640" fill="var(--base)"/>
<rect width="720" height="64" fill="var(--panel)" opacity=".55"/>
<text x="40" y="44" fill="var(--ink)" font-size="22" font-weight="700">Boot sequence</text>
<line x1="58" y1="96" x2="58" y2="176" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="96" x2="58" y2="176" stroke="#1c8fb8" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,1.1s"/>
<circle class="dot" cx="58" cy="96" r="4" fill="#1c8fb8" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:1.1s"/>
<line x1="58" y1="176" x2="58" y2="256" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="176" x2="58" y2="256" stroke="#0ca678" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,2.2s"/>
<circle class="dot" cx="58" cy="176" r="4" fill="#0ca678" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:2.2s"/>
<line x1="58" y1="256" x2="58" y2="336" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="256" x2="58" y2="336" stroke="#c77f0a" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,3.3s"/>
<circle class="dot" cx="58" cy="256" r="4" fill="#c77f0a" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:3.3s"/>
<line x1="58" y1="336" x2="58" y2="416" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="336" x2="58" y2="416" stroke="#7c5cff" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,4.4s"/>
<circle class="dot" cx="58" cy="336" r="4" fill="#7c5cff" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:4.4s"/>
<line x1="58" y1="416" x2="58" y2="496" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="416" x2="58" y2="496" stroke="#d6336c" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,5.5s"/>
<circle class="dot" cx="58" cy="416" r="4" fill="#d6336c" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:5.5s"/>
<line x1="58" y1="496" x2="58" y2="576" stroke="var(--line)" stroke-width="3"/>
<line class="fl" x1="58" y1="496" x2="58" y2="576" stroke="#0a84ff" style="animation:marchV 1.1s linear infinite,spot 7.7s linear infinite;animation-delay:0s,6.6s"/>
<circle class="dot" cx="58" cy="496" r="4" fill="#0a84ff" style="--span:80px;animation:drop 7.7s ease-in-out infinite;animation-delay:6.6s"/>
<circle cx="58" cy="96" r="15" class="node"/>
<circle class="fill" cx="58" cy="96" r="11" fill="url(#bfill0)" style="animation:spot 7.7s linear infinite;animation-delay:0.0s"/>
<circle class="ring" cx="58" cy="96" r="21" stroke="#e8362d" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:0.0s,0.0s"/>
<text x="92" y="93" class="t">Firmware starts</text>
<text x="92" y="112" class="d">MiniHub starting…</text>
<circle cx="58" cy="176" r="15" class="node"/>
<circle class="fill" cx="58" cy="176" r="11" fill="url(#bfill1)" style="animation:spot 7.7s linear infinite;animation-delay:1.1s"/>
<circle class="ring" cx="58" cy="176" r="21" stroke="#1c8fb8" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:1.1s,1.1s"/>
<text x="92" y="173" class="t">Storage mounts</text>
<text x="92" y="192" class="d">/data and /store</text>
<circle cx="58" cy="256" r="15" class="node"/>
<circle class="fill" cx="58" cy="256" r="11" fill="url(#bfill2)" style="animation:spot 7.7s linear infinite;animation-delay:2.2s"/>
<circle class="ring" cx="58" cy="256" r="21" stroke="#0ca678" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:2.2s,2.2s"/>
<text x="92" y="253" class="t">Uplinks prepared</text>
<text x="92" y="272" class="d">Ethernet up; Wi-Fi STA deferred</text>
<circle cx="58" cy="336" r="15" class="node"/>
<circle class="fill" cx="58" cy="336" r="11" fill="url(#bfill3)" style="animation:spot 7.7s linear infinite;animation-delay:3.3s"/>
<circle class="ring" cx="58" cy="336" r="21" stroke="#c77f0a" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:3.3s,3.3s"/>
<text x="92" y="333" class="t">Web server up</text>
<text x="92" y="352" class="d">HTTP on port 80, before the radio stacks</text>
<circle cx="58" cy="416" r="15" class="node"/>
<circle class="fill" cx="58" cy="416" r="11" fill="url(#bfill4)" style="animation:spot 7.7s linear infinite;animation-delay:4.4s"/>
<circle class="ring" cx="58" cy="416" r="21" stroke="#7c5cff" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:4.4s,4.4s"/>
<text x="92" y="413" class="t">Adapters start</text>
<text x="92" y="432" class="d">Zigbee / BLE Mesh / … as built</text>
<circle cx="58" cy="496" r="15" class="node"/>
<circle class="fill" cx="58" cy="496" r="11" fill="url(#bfill5)" style="animation:spot 7.7s linear infinite;animation-delay:5.5s"/>
<circle class="ring" cx="58" cy="496" r="21" stroke="#d6336c" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:5.5s,5.5s"/>
<text x="92" y="493" class="t">Network address</text>
<text x="92" y="512" class="d">eth got IP / wifi got IP</text>
<circle cx="58" cy="576" r="15" class="node"/>
<circle class="fill" cx="58" cy="576" r="11" fill="url(#bfill6)" style="animation:spot 7.7s linear infinite;animation-delay:6.6s"/>
<circle class="ring" cx="58" cy="576" r="21" stroke="#0a84ff" style="animation:spot 7.7s linear infinite,breath 7.7s ease-in-out infinite;animation-delay:6.6s,6.6s"/>
<text x="92" y="573" class="t">Hub ready</text>
<text x="92" y="592" class="d">net · prov · web_ui · lcd_ui · eth · wifi</text>
</svg>
