# Product profile for application/minihub (merged with config/minihub_manifest.yml _host_base).
# Sync: MINIHUB_APP=minihub python tools/sync_host_manifest.py
#
# Config JSON: application/minihub/config/{adapters,rules,scenes}.json → else repo config/
# Factory Store modules: store_preinstall (ids under components/minihub_plugins/
# and/or any dir named in MINIHUB_PLUGIN_DIRS — no copy/symlink needed).
extends: _host_base
store_preinstall: []
partition_table: partitions.csv
board: esp32_s31_function_coreboard_1
sdkconfig_features:
- common
- memory
- partitions_16m
- eth
- wifi_sta
- usb_msc
- rtsp_cam
- dynamic_modules
- modbus
- factory_reset_gpio61
- main_task_stack
- rainmaker
variants:
  # Used when application/minihub/config/sdkconfig/app.yml features include lcd
  lcd:
    extends: _host_base
    partition_table: partitions.csv
    board: esp32_s31_korvo1
    sdkconfig_features:
    - common
    - memory
    - partitions_16m
    - wifi_sta
    - lcd
    - lcd_brookesia_storage
    - dynamic_modules
    - modbus
    - rainmaker
    components:
      lcd_ui: true
      require:
      - minihub_core
      - minihub_config
      - minihub_adapter
      - minihub_rules
      - minihub_scenes
      - minihub_web
      - minihub_pack
      - minihub_module
      - minihub_store
      - minihub_hub
      - minihub_auth
      - minihub_ota
      - minihub_provision
      - minihub_matter
      - minihub_thread
      - minihub_rainmaker
      - minihub_lcd
      - minihub_net
      - gen_bmgr_codes
      - adapter_mqtt
      - adapter_zigbee
      - adapter_ble_mesh
      - adapter_modbus
      - adapter_matter
      - adapter_thread
      - minihub_zigbee
      - minihub_ble_mesh
      - minihub_ble_gatt
      - minihub_usb_msc
      - minihub_rtsp_cam
      - nvs_flash
      - esp_wifi
      - esp_netif
      - esp_event
      - lwip
      - esp_system
    idf_dependencies:
      espressif/esp_lcd_touch_gt1151: '*'
      espressif/brookesia_lib_utils: 0.8.*
      espressif/brookesia_hal_adaptor: 0.8.*
      espressif/brookesia_hal_boards: 0.8.*
      espressif/brookesia_service_manager: 0.8.*
      espressif/brookesia_service_helper: 0.8.*
      espressif/brookesia_service_display: 0.8.*
      espressif/brookesia_gui_interface: 0.8.*
      espressif/brookesia_gui_lvgl: 0.8.*
      espressif/esp_lvgl_adapter: 0.6.*
    component_manifests:
      minihub_lcd:
        dependencies:
          espressif/brookesia_lib_utils: 0.8.*
          espressif/brookesia_hal_adaptor: 0.8.*
          espressif/brookesia_hal_boards: 0.8.*
          espressif/brookesia_service_manager: 0.8.*
          espressif/brookesia_service_helper: 0.8.*
          espressif/brookesia_service_display: 0.8.*
          espressif/brookesia_gui_interface: 0.8.*
          espressif/brookesia_gui_lvgl: 0.8.*
          espressif/esp_lvgl_adapter: 0.6.*
