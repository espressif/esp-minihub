# Product profile for application/minihub (merged with configs/minihub_manifest.yml _host_base).
# Sync: MINIHUB_APP=minihub python tools/sync_host_manifest.py
#
# Config JSON: application/minihub/configs/{adapters,rules,scenes}.json → else repo configs/
# Factory Store modules: store_preinstall (ids under examples/plugins/
# and/or any dir named in MINIHUB_PLUGIN_DIRS).
extends: _host_base
store_preinstall: []
partition_table: partitions.csv
board: esp32_s31_function_coreboard_1
sdkconfig_features:
- common
- memory
- partitions_16m
- eth
- wifi_sta
- usb_msc
- rtsp_cam
- dynamic_modules
- modbus
- factory_reset_gpio61
- main_task_stack
- rainmaker
# No variants.lcd — LCD is application/minihub_lcd only (esp32_s31_korvo1).
# This product is Ethernet Function CoreBoard (esp32_s31_function_coreboard_1).
