## mosquitto when CONFIG_MINIHUB_MQTT_BROKER=y; esp-mqtt client when
## CONFIG_MINIHUB_MQTT_ADAPTER=y (Component Manager $CONFIG has no CONFIG_ prefix).
dependencies:
  espressif/mosquitto:
    version: "2.0.20~9"
    rules:
      - if: "$CONFIG{MINIHUB_MQTT_BROKER} == True"
  espressif/mqtt:
    version: "1.1.0"
    rules:
      - if: "$CONFIG{MINIHUB_MQTT_ADAPTER} == True"
