<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262B"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="hi" cx="0.30" cy="0.24" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="br" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .br{transform-box:fill-box;transform-origin:center;animation:breathe 4.5s ease-in-out infinite}
    @keyframes breathe{0%{opacity:.22;transform:scale(.94)}50%{opacity:.58;transform:scale(1.06)}100%{opacity:.22;transform:scale(.94)}}
    @media (prefers-reduced-motion:reduce){.br{animation:none;opacity:.38}}
  </style>
  <rect width="96" height="96" rx="22" fill="url(#bg)"/>
  <rect width="96" height="96" rx="22" fill="url(#hi)"/>
  <circle class="br" cx="48" cy="50" r="34" fill="url(#br)"/>
  <g stroke="#0A84FF" stroke-width="7" stroke-linecap="round">
    <line x1="48" y1="40" x2="48" y2="20"/>
    <line x1="48" y1="40" x2="30" y2="52"/>
    <line x1="48" y1="40" x2="66" y2="52"/>
  </g>
  <circle cx="48" cy="40" r="6" fill="#1C1C1E" stroke="#0A84FF" stroke-width="3"/>
  <circle cx="48" cy="68" r="10" fill="#FFD60A"/>
  <path d="M48 58 v-6" stroke="#8E8E93" stroke-width="3" stroke-linecap="round"/>
