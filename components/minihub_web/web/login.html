<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniHub</title>
<style>
body{font-family:system-ui,sans-serif;background:#0b0f1a;color:#eef2ff;
display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:24px}
.box{width:100%;max-width:360px;border:1px solid #243049;border-radius:14px;padding:24px;background:#151c2f}
h1{font-size:1.1rem;margin:0 0 8px}
p{color:#8b9bb4;font-size:.85rem;margin:0 0 16px}
label{display:block;font-size:.8rem;margin:10px 0 4px;color:#8b9bb4}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #243049;
background:#0b0f1a;color:#eef2ff}
button{margin-top:16px;width:100%;padding:10px;border:0;border-radius:8px;
background:#4f46e5;color:#fff;font-weight:600;cursor:pointer}
.secret-field{position:relative}
.secret-field input{padding-right:58px}
button.secret-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);
margin:0;width:auto;padding:4px 6px;border:0;border-radius:6px;background:transparent;
color:#8b9bb4;font-weight:500;font-size:.75rem;cursor:pointer}
.err{color:#f87171;font-size:.8rem;min-height:1.2em}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
select,#lang-sel{width:auto;margin:0;padding:4px 8px;border-radius:8px;border:1px solid #243049;
background:#0b0f1a;color:#8b9bb4;font-size:.72rem;font-weight:600;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h1 id="title">登录</h1>
    <button id="lang-sel" type="button" onclick="switchLangSel()"></button>
  </div>
  <p id="hint">输入 admin 密码进入控制台。</p>
  <form id="f">
    <label data-i18n="login.user">用户名</label>
    <input id="user" value="admin" readonly>
    <label data-i18n="login.password">密码</label>
    <div class="secret-field">
      <input id="pw" type="password" minlength="6" maxlength="64" autocomplete="current-password">
      <button type="button" class="secret-toggle" id="eye" onclick="toggleSecret(this)">显示</button>
    </div>
    <div class="err" id="err"></div>
    <button type="submit" id="go" data-i18n="login.submit">确定</button>
  </form>
</div>
<script>
/* Inline minimal localisation so the login form can render and work
 * immediately, without waiting for the full console i18n dictionary. */
const LANG_KEY = 'minihub.lang';
/* Same table as js/i18n.js (kept duplicated on purpose: this page must work with
 * no fetch at all). Options, validity and the "switch to" target all read it. */
const LANGS = [
  { code: 'zh_CN', self: '中文', locale: 'zh-CN' },
  { code: 'en', self: 'English', locale: 'en-US' }
];
const DICT = {
  zh_CN: {
    'lang.switch_to': '切换到 {lang}',
    'login.title.signin': '登录',
    'login.title.setup': '设置密码',
    'login.hint.signin': '输入 admin 密码进入控制台。',
    'login.hint.setup': '用户名固定为 admin，请设置至少 6 位密码。',
    'login.user': '用户名',
    'login.password': '密码',
    'login.show': '显示',
    'login.hide': '隐藏',
    'login.aria.show': '显示密码',
    'login.aria.hide': '隐藏密码',
    'login.submit': '确定',
    'login.err.expired': '会话已失效：其它终端登录过，或长时间未打开页面。',
    'login.err.setup': '设置失败（密码至少 6 位，且只能设置一次）',
    'login.err.creds': '用户名或密码错误',
    'login.err.net': '网络错误'
  },
  en: {
    'lang.switch_to': 'Switch to {lang}',
    'login.title.signin': 'Sign in',
    'login.title.setup': 'Set password',
    'login.hint.signin': 'Enter the admin password to open the console.',
    'login.hint.setup': 'The username is fixed to admin. Choose a password of at least 6 characters.',
    'login.user': 'Username',
    'login.password': 'Password',
    'login.show': 'Show',
    'login.hide': 'Hide',
    'login.aria.show': 'Show password',
    'login.aria.hide': 'Hide password',
    'login.submit': 'Submit',
    'login.err.expired': 'Session ended: another device signed in, or this page stayed closed for a long time.',
    'login.err.setup': 'Could not set the password (at least 6 characters, and it can only be set once).',
    'login.err.creds': 'Wrong username or password',
    'login.err.net': 'Network error'
  }
};

function langRow(code) {
  for (let i = 0; i < LANGS.length; i++) { if (LANGS[i].code === code) return LANGS[i]; }
  return null;
}

function isLang(v) { return !!langRow(v); }

function resolveLang() {
  let stored = null;
  try { stored = localStorage.getItem(LANG_KEY); } catch (e) {}
  if (isLang(stored)) return stored;
  const wanted = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ''];
  for (let i = 0; i < wanted.length; i++) {
    const w = String(wanted[i]).toLowerCase();
    for (let j = 0; j < LANGS.length; j++) {
      if (w.indexOf(LANGS[j].code.split('_')[0]) === 0) return LANGS[j].code;
    }
  }
  return 'en';
}

const lang = resolveLang();
const strings = DICT[lang];
const base = DICT.zh_CN;

function t(key, vars) {
  let s = Object.prototype.hasOwnProperty.call(strings, key) ? strings[key] : null;
  if (s === null && Object.prototype.hasOwnProperty.call(base, key)) s = base[key];
  if (s === null) return key;
  if (vars) {
    for (const k in vars) {
      if (Object.prototype.hasOwnProperty.call(vars, k)) {
        s = s.split('{' + k + '}').join(String(vars[k]));
      }
    }
  }
  return s;
}

function applyI18n(root) {
  const scope = root || document;
  scope.querySelectorAll('[data-i18n]').forEach(function (el) {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  scope.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    el.placeholder = t(el.getAttribute('data-i18n-ph'));
  });
  document.documentElement.lang = langRow(lang).locale;
  syncLangSel();
}

/* The control shows the language you would switch TO, not the one you are in. */
function syncLangSel() {
  const el = document.getElementById('lang-sel');
  if (!el) return;
  const other = LANGS.filter(function (l) { return l.code !== lang; })[0];
  el.textContent = other.self;
  el.dataset.next = other.code;
  const name = t('lang.switch_to', { lang: other.self });
  el.setAttribute('aria-label', name);
  el.title = name;
}

function switchLangSel() {
  const el = document.getElementById('lang-sel');
  if (el && el.dataset.next) setLang(el.dataset.next);
}

function setLang(next) {
  if (!isLang(next) || next === lang) return;
  try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
  location.reload();
}

applyI18n(document);

let setup = false;
let expired = new URLSearchParams(location.search).get('reason') === 'expired';

/* Auth state is injected server-side (window.__mhAuth) so the login page never
 * needs to fetch a JSON endpoint. Browser JSON-viewer extensions can replace
 * the current document with a JSON fetch response, which would hide the form. */
if (typeof window.__mhAuth === 'object' && window.__mhAuth !== null) {
    if (window.__mhAuth.login_auth === false) { location.href = '/'; }
    setup = !window.__mhAuth.password_set;
    expired = !!window.__mhAuth.expired;
    if (!expired && window.__mhAuth.logged_in) { location.href = '/'; }
}

function paintSecret() {
  const btn = document.getElementById('eye');
  const show = document.getElementById('pw').type === 'password';
  btn.textContent = t(show ? 'login.show' : 'login.hide');
  btn.setAttribute('aria-label', t(show ? 'login.aria.show' : 'login.aria.hide'));
}

function paint() {
  document.getElementById('title').textContent = t(setup ? 'login.title.setup' : 'login.title.signin');
  document.getElementById('hint').textContent =
    t(setup ? 'login.hint.setup' : 'login.hint.signin');
  document.getElementById('go').textContent = t('login.submit');
  paintSecret();
  if (expired) {
    document.getElementById('err').textContent = t('login.err.expired');
  }
}

function toggleSecret(btn) {
  const input = btn.parentElement.querySelector('input');
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
  paintSecret();
}

if (new URLSearchParams(location.search).get('reason') === 'expired') {
  expired = true;
  document.getElementById('err').textContent = t('login.err.expired');
}

const goBtn = document.getElementById('go');
if (goBtn) goBtn.disabled = true;

paint();
if (goBtn) goBtn.disabled = false;

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  document.getElementById('err').textContent = '';
  const body = JSON.stringify({
    username: document.getElementById('user').value,
    password: document.getElementById('pw').value
  });
  const url = setup ? '/api/auth/setup' : '/api/auth/login';
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
    if (r.ok) { location.href = '/'; return; }
    document.getElementById('err').textContent =
      t(setup ? 'login.err.setup' : 'login.err.creds');
  } catch (e) {
    document.getElementById('err').textContent = t('login.err.net');
  }
};

window.mhLang = lang;
window.t = t;
window.setLang = setLang;
</script>
</body>
</html>
