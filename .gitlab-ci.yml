# Build every application/ firmware (+ merged flash bin).
# Pack Store .mhub once in pack:mhub when libadapter_*.so exist (skip OK if none).
#
# IDF: ESP32-S31 / MiniHub expects IDF ~6.2 (see docs/en/getting_started.rst).
# Override IDF_CI_IMAGE in GitLab CI/CD variables for an internal 6.2 / S31 image.
#
# Pre-commit: .gitlab/ci/pre_check.yml (esp-at style).

workflow:
  rules:
    # Same SHA: keep MR pipeline only (skip branch push while MR is open).
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        IS_MR_PIPELINE: "1"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH
      variables:
        IS_MR_PIPELINE: "0"
    - if: $CI_COMMIT_BRANCH
      variables:
        IS_MR_PIPELINE: "0"

stages:
  - pre_check
  - build
  - pack

variables:
  IDF_CI_IMAGE: "espressif/idf:latest"
  # Product (-app / MINIHUB_APP): application/<name>/  e.g. minihub
  MINIHUB_APP: "minihub"
  # Firmware jobs never pack .mhub; pack:mhub owns Store packages
  MINIHUB_SKIP_MHUB: "1"
  # Matter needs a local ESP_MATTER_PATH tree (not cloned here)
  MINIHUB_BUILD_MATTER: "0"
  # RainMaker: submodule application/minihub/components/esp-rainmaker (leave unset to follow
  # application/minihub/config/sdkconfig/feature/rainmaker.defaults). Set to "0" to force stub-only.
  # MINIHUB_BUILD_RAINMAKER: "0"
  MINIHUB_CI_ARTIFACTS: "$CI_PROJECT_DIR/ci_artifacts"
  MINIHUB_STORE_DEPLOY: "$CI_PROJECT_DIR/ci_artifacts/store"
  GIT_DEPTH: "50"
  # Path-scoped init in tools/ci/build_apps.sh (avoid pulling all submodules)
  GIT_SUBMODULE_STRATEGY: "none"
  # External plugins repo (esp-minihub-plugins) compiled alongside Core below.
  # Derived from predefined vars (CI_SERVER_URL + CI_PROJECT_NAMESPACE) so the
  # host/namespace is never hardcoded into this file.
  MINIHUB_PLUGINS_REPO_URL: "${CI_SERVER_URL}/${CI_PROJECT_NAMESPACE}/esp-minihub-plugins.git"
  MINIHUB_PLUGINS_REF: "$CI_COMMIT_REF_NAME"
  # Cloned into a subdir of the Core checkout (so it is not mistaken for the
  # Core repo itself, which also has a .git).
  MINIHUB_PLUGINS_DIR: "$CI_PROJECT_DIR/.ci/esp-minihub-plugins"
  # Build plugins with the same IDF image as Core so the SDK matches.
  MINIHUB_IDF_IMAGE: "$IDF_CI_IMAGE"

include:
  - local: .gitlab/ci/pre_check.yml
  - project: '../esp-minihub-plugins'
    ref: 'master'
    file: 'ci/plugins.gitlab-ci.yml'

.idf_env:
  image:
    name: $IDF_CI_IMAGE
    entrypoint: [""]
  before_script:
    - git config --global --add safe.directory "$CI_PROJECT_DIR" || true
    - |
      if [ -f "$IDF_PATH/export.sh" ]; then
        # shellcheck source=/dev/null
        . "$IDF_PATH/export.sh"
      elif [ -f /opt/esp/idf/export.sh ]; then
        # shellcheck source=/dev/null
        . /opt/esp/idf/export.sh
      fi
    - idf.py --version || true
    - python3 --version
    - mkdir -p "$MINIHUB_CI_ARTIFACTS" "$MINIHUB_STORE_DEPLOY"

.build_app:
  extends: .idf_env
  stage: build
  artifacts:
    when: on_success
    expire_in: 14 days
    name: "minihub-$APP-$CI_COMMIT_SHORT_SHA"
    paths:
      # Staged from flasher_args.json flash_files (+ elf/map/merged/sdkconfig) by stage_artifacts.sh
      - ci_artifacts/$APP/
      # Needed by pack:mhub (minihub fills these; other apps may be empty)
      - application/$APP/build/modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build:app:
  extends: .build_app
  parallel:
    matrix:
      - APP:
          - minihub
  variables:
    MINIHUB_APP: "$APP"
  script:
    - test -f "application/${APP}/CMakeLists.txt"
    - bash tools/ci/build_apps.sh
    - test -f "ci_artifacts/${APP}/firmware/flasher_args.json"
    - test -f "ci_artifacts/${APP}/firmware/sdkconfig"
    - test -f "ci_artifacts/${APP}/firmware/${APP}_merged.bin"
    - test -f "application/${APP}/build/minihub_merged.bin"

# Store pack (no-op success when minihub built no libadapter_*.so)
pack:mhub:
  extends: .idf_env
  stage: pack
  needs:
    - job: build:app
      parallel:
        matrix:
          - APP: minihub
  script:
    - bash tools/ci/pack_store_modules.sh
  artifacts:
    when: on_success
    expire_in: 14 days
    name: "minihub-mhub-$CI_COMMIT_SHORT_SHA"
    paths:
      - ci_artifacts/mhub/
      - ci_artifacts/store/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
